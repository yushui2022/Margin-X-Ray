<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Margin X-Ray</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body class="mx-theme">
    <div class="app">
      <header class="header">
        <div class="brand">
          <div class="logo">X</div>
          <div class="brand-text">
            <div class="brand-name">Margin X-Ray</div>
            <div class="brand-sub">Factory cost lens</div>
          </div>
        </div>
        <span id="modeBadge" class="badge demo">DEMO</span>
      </header>

      <main class="main">
        <button id="scanBtn" class="btn primary" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          <span>Open X-Ray</span>
        </button>
        <button id="captureBtn" class="btn secondary" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><path d="M12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
          <span>Capture screen</span>
        </button>
        <div id="status" class="status" role="status" aria-live="polite">
          Open a product page, or capture the current screen.
        </div>

        <label class="switch-row" for="demoToggle">
          <span>
            <span class="switch-title">Demo mode</span>
            <span class="switch-sub">No API key or server needed.</span>
          </span>
          <input id="demoToggle" type="checkbox" />
          <span class="switch" aria-hidden="true"></span>
        </label>

        <div id="demoHint" class="hint">
          Demo mode uses a clearly labeled sample dataset. It never invents a
          fallback factory price.
        </div>

        <section id="lastScan" class="last-scan" hidden>
          <div class="section-title">Last scan</div>
          <div id="lastScanTitle" class="last-scan-title"></div>
          <div id="lastScanMeta" class="last-scan-meta"></div>
        </section>
      </main>

      <footer class="footer">
        <button id="optionsBtn" class="link" type="button">Settings</button>
        <span id="version">v0.1.0</span>
      </footer>
    </div>
    <script src="popup.js" defer></script>
  </body>
</html>
